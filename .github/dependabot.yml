# Dependabot: the npm packages weekly, the minor and patch updates in one
# pull request, a major on its own; the workflows' actions monthly. A new
# @petiole/sdk brings the API's spec it was released with to the tests.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types of the Node the site builds and runs on, 24.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 waits for typescript-eslint, which takes TypeScript
      # below 6.1.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
