# ci: on every push and pull request, the lint, the types, the unit tests,
# the contract tests against a mock of the Petiole API's spec that Prism
# serves (the spec released with the @petiole/sdk this app depends on), the
# build, and the app end to end in a browser against the same mock. No
# secret: nothing here calls the Petiole API.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, types, tests, build, end to end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:contract
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: The end-to-end report, when they fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
